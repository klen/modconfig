[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modconfig"
description = "Simple hierarchic configuration manager for apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
keywords = ["settings", "configuration"]
requires-python = ">=3.11"
version = "1.3.1"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
]

[project.urls]
Documentation = "https://github.com/klen/modconfig"
Source = "https://github.com/klen/modconfig"
"Issue tracker" = "https://github.com/klen/modconfig/issues"

[dependency-groups]
dev = ["pytest", "pytest-mypy"]

[tool.setuptools]
packages = ["modconfig"]

[tool.setuptools.package-data]
modconfig = ["py.typed"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "-xsv --mypy"
